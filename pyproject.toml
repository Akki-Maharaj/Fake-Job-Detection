[project]
name = "fake-job-detection"
version = "0.1.0"
description = "Fraudulent job posting detection: TF-IDF baseline + fine-tuned DistilBERT."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1,<2.5",
    "transformers>=4.38,<5.0",
    "scikit-learn>=1.3,<1.6",
    "pandas>=2.0,<2.3",
    "numpy>=1.24,<2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "tensorboard>=2.15",
    "pyyaml>=6.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4"]

[project.scripts]
fjd = "scripts.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
